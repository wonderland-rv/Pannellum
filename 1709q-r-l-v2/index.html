:root{
  --ink:#1D1D1B; --text:#414042; --orange:#DB7627; --paper:#FFFFFF; --line:#E4E2DF; --off:#F7F6F5;
  --display:"Aviano Sans","Arial Black",Arial,sans-serif;
  --body:"Gordita","Helvetica Neue",Arial,sans-serif;
  --strip:118px;
  color-scheme:light;
}
html,body{height:100%}
body{background:#151514;color:var(--ink);font-family:var(--body);overflow:hidden;-webkit-font-smoothing:antialiased}
#pano{position:fixed;inset:0;background:#151514}
.pnlm-container{background:#151514!important;font-family:var(--body)!important}
.pnlm-load-box{background:var(--paper)!important;color:var(--ink)!important;border-radius:0!important;width:200px!important;height:auto!important;padding:18px 16px!important;margin:-40px 0 0 -100px!important}
.pnlm-load-box p{margin:0 0 10px!important;font-family:var(--display);font-size:13px;letter-spacing:0;text-transform:lowercase}
.pnlm-lbar{border-color:var(--orange)!important;border-radius:0!important;width:100%!important;margin:0!important}
.pnlm-lbar-fill{background:var(--orange)!important;border-radius:0!important}
.pnlm-lmsg{display:none}
.pnlm-lbox{display:none!important}

/* top-left identity panel */
.brand{position:fixed;z-index:5;top:calc(16px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));
  background:var(--paper);padding:14px 18px 13px;display:grid;gap:9px;box-shadow:0 2px 14px rgba(0,0,0,.18);max-width:calc(100vw - 32px - 104px)}
.brand > svg{height:17px;width:auto;display:block}
.brand > svg path{fill:var(--ink)}
.brand .kicker .code{color:var(--ink);margin-left:6px}
.brand .kicker{font-family:var(--display);font-size:12px;color:var(--orange);text-transform:lowercase;line-height:1;word-spacing:.09em}
.brand{width:320px}
.brand h1{margin:0;font-family:var(--body);font-weight:500;font-size:15px;line-height:1.25;color:var(--ink);text-wrap:balance}
.brand .room{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px;color:var(--text);border-top:1px solid var(--line);padding-top:8px}
.brand .room span{font-weight:500;color:var(--ink)}
.map-toggle{display:none;font-family:var(--display);font-size:12px;text-transform:lowercase;background:#fff;color:var(--orange);border:0;border-radius:1px;
  box-shadow:rgb(219,118,39) 0 0 0 1.5px inset;padding:6px 10px;cursor:pointer}
.map{position:relative;width:100%;line-height:0}
.map img{width:100%;height:auto;display:block}
.map svg{position:absolute;inset:0;width:100%;height:100%}
.map .mdot{cursor:pointer}
.map .hit{fill:transparent}
.map .dot{fill:#fff;stroke:#1D1D1B;stroke-width:5;transition:fill .2s}
.map .mdot:hover .dot{fill:#DB7627}
.map .mdot.here .dot{fill:#DB7627;stroke:#fff;stroke-width:8}
.map .cone{fill:rgba(219,118,39,.32);stroke:none;pointer-events:none}

/* top-right tools */
.tools{position:fixed;z-index:5;top:calc(16px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:8px}
.tool{width:44px;height:44px;border:0;border-radius:1px;background:var(--paper);color:var(--ink);display:grid;place-items:center;cursor:pointer;
  box-shadow:0 2px 14px rgba(0,0,0,.18);transition:background .3s,color .3s,box-shadow .3s}
.tool svg{width:20px;height:20px}
.tool:hover,.tool:focus-visible,.tool[aria-pressed="true"]{color:var(--orange);box-shadow:rgb(219,118,39) 0 0 0 2px inset,0 2px 14px rgba(0,0,0,.18);outline:none}

/* bottom scene strip */
.strip{position:fixed;z-index:5;left:0;right:0;bottom:0;background:var(--paper);
  padding-top:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.strip ol{list-style:none;margin:0;padding:0 0 2px;display:flex;gap:10px;overflow-x:auto;scrollbar-width:thin}
.strip li{flex:0 0 auto}
.scene-btn{display:grid;gap:7px;padding:0;border:0;background:none;cursor:pointer;text-align:left;font-family:var(--body);color:var(--text)}
.scene-btn img{display:block;width:118px;height:72px;object-fit:cover;outline:3px solid transparent;outline-offset:-3px;transition:outline-color .3s,opacity .3s;opacity:.9}
.scene-btn span{font-size:12.5px;font-weight:500;line-height:1}
.scene-btn:hover img,.scene-btn:focus-visible img{opacity:1;outline-color:var(--line)}
.scene-btn:focus-visible{outline:none}
.scene-btn[aria-current="true"] img{opacity:1;outline-color:var(--orange)}
.scene-btn[aria-current="true"] span{color:var(--orange)}
.scene-btn .n{font-family:var(--display);font-size:11px;color:var(--orange);margin-right:6px}

/* storage toggle: the site's orange button */
.storage{position:fixed;z-index:6;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(var(--strip) + 16px + env(safe-area-inset-bottom,0px));
  font-family:var(--display);font-size:16px;text-transform:lowercase;letter-spacing:0;word-spacing:.09em;
  background:#DB7627;color:#fff;border:0;border-radius:1px;padding:16px 28px;cursor:pointer;display:flex;align-items:center;gap:10px;
  box-shadow:0 2px 14px rgba(0,0,0,.2);transition:background .3s,color .3s,box-shadow .3s}
.storage svg{width:18px;height:18px}
.storage:hover,.storage:focus-visible{background:#fff;color:#DB7627;box-shadow:rgb(219,118,39) 0 0 0 2px inset,0 2px 14px rgba(0,0,0,.2);outline:none}

/* hint */
.hint{position:fixed;z-index:4;left:50%;transform:translateX(-50%);bottom:calc(var(--strip) + 22px + env(safe-area-inset-bottom,0px));
  background:rgba(29,29,27,.82);color:#fff;font-size:13px;padding:10px 14px;transition:opacity .6s;pointer-events:none;white-space:nowrap}
.hint.gone{opacity:0}

/* floor circles: true discs on the floor, re-projected every frame (Matterport style) */
#ov{position:fixed;inset:0;z-index:2;width:100%;height:100%;pointer-events:none;overflow:visible}
#ov .shade{fill:none;stroke:rgba(0,0,0,.20);stroke-width:6}
#ov .disc{fill:rgba(255,255,255,.24);stroke:rgba(255,255,255,.95);stroke-width:3;transition:fill .25s,stroke .25s}
#ov .core{fill:rgba(255,255,255,.34)}
#ov .spot.focus .disc{fill:rgba(219,118,39,.30);stroke:#DB7627}
#pano.can-go .pnlm-ui,#pano.can-go .pnlm-dragfix{cursor:pointer!important}
#ov .ring{fill:rgba(255,255,255,.12);stroke:rgba(255,255,255,.85);stroke-width:2;transition:fill .2s,stroke .2s}
#ov .ring.go{fill:rgba(219,118,39,.22);stroke:#DB7627}
.spot-tag{position:fixed;z-index:3;transform:translate(-50%,0);background:var(--paper);color:var(--ink);font-family:var(--body);font-weight:500;
  font-size:12.5px;line-height:1;padding:7px 9px;white-space:nowrap;box-shadow:0 2px 10px rgba(0,0,0,.2);pointer-events:none;opacity:0;transition:opacity .2s}
.spot-tag.on{opacity:1}
@media (hover:none){#ov .ring{display:none}}
/* way back from a raised or storage spot: gentle pulse in the hover colours */
@keyframes wlPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.22)}}
@keyframes wlTint{0%,100%{fill:rgba(255,255,255,.24);stroke:rgba(255,255,255,.95)}50%{fill:rgba(219,118,39,.45);stroke:#DB7627}}
#ov .spot.nudge{transform-box:fill-box;transform-origin:center;animation:wlPulse 1.6s ease-in-out infinite}
#ov .spot.nudge .disc{animation:wlTint 1.6s ease-in-out infinite}
@keyframes wlBtn{0%,100%{transform:scale(1);background:#DB7627;color:#fff}50%{transform:scale(1.08);background:#fff;color:#DB7627;box-shadow:rgb(219,118,39) 0 0 0 2px inset,0 2px 14px rgba(0,0,0,.2)}}
.storage.nudge{animation:wlBtn 1.6s ease-in-out infinite}
/* edge arrow: shows only while no way-out circle is in view */
.edge{position:fixed;z-index:4;left:0;top:0;width:52px;height:52px;margin:-26px 0 0 -26px;padding:0;border:0;border-radius:50%;background:#DB7627;color:#fff;
  box-shadow:0 0 0 2px #fff,0 2px 14px rgba(0,0,0,.28);cursor:pointer;display:none;align-items:center;justify-content:center;opacity:.85;transition:background-color .3s,color .3s,opacity .3s;-webkit-tap-highlight-color:transparent}
.edge.on{display:flex;animation:wlEdge 1.6s ease-in-out infinite}
.edge svg{width:22px;height:22px;display:block}
.edge:focus-visible{opacity:1;outline:none}
@media (hover:hover){.edge:hover{opacity:1;background:#fff;color:#DB7627;box-shadow:rgb(219,118,39) 0 0 0 2px inset,0 2px 14px rgba(0,0,0,.2)}}
@keyframes wlEdge{0%,100%{scale:1}50%{scale:1.1}}
@media (prefers-reduced-motion:reduce){.edge.on{animation:none}}
@media (prefers-reduced-motion:reduce){#ov .spot.nudge,#ov .spot.nudge .disc,.storage.nudge{animation:none}#ov .spot.nudge .disc{fill:rgba(219,118,39,.45);stroke:#DB7627}}

/* start screen */
.intro{position:fixed;inset:0;z-index:20;display:grid;grid-template-rows:auto 1fr auto;justify-items:center;text-align:center;color:#fff;background:#151514;
  padding:max(48px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));transition:opacity .5s}
.intro.gone{opacity:0;pointer-events:none}
.intro-bg{position:absolute;inset:-20px;background-size:cover;background-position:center;filter:blur(6px) brightness(.62)}
.intro > *:not(.intro-bg){position:relative}
.intro-code{font-family:var(--body);font-weight:500;font-size:13px;letter-spacing:.14em;color:#fff;opacity:.9;margin-bottom:10px}
.intro-title{margin:0;font-family:var(--display);font-weight:900;font-size:clamp(26px,4.4vw,52px);text-transform:uppercase;line-height:1.05;word-spacing:.09em;text-wrap:balance;max-width:16ch;text-shadow:0 2px 18px rgba(0,0,0,.35)}
.intro-play{align-self:center;display:grid;justify-items:center;gap:16px;background:none;border:0;color:#fff;cursor:pointer;font-family:var(--body)}
.intro-play .disc{width:92px;height:92px;border-radius:50%;background:#fff;color:#1D1D1B;display:grid;place-items:center;box-shadow:0 6px 30px rgba(0,0,0,.3);transition:background .3s,color .3s}
.intro-play .disc svg{width:38px;height:38px;margin-left:5px}
.intro-play:hover .disc,.intro-play:focus-visible .disc{background:#DB7627;color:#fff}
.intro-play:focus-visible{outline:none}
.intro-play .label{font-size:17px;font-weight:500;text-shadow:0 1px 10px rgba(0,0,0,.4)}
.intro-powered{font-size:10.5px;letter-spacing:.16em;opacity:.9}
.intro-powered b{display:block;font-family:var(--body);font-weight:500;letter-spacing:0;font-size:17px;margin-top:4px}

@media (max-width:640px){
  :root{--strip:96px}
  .brand{padding:11px 13px 10px;gap:7px}

  .tool{width:40px;height:40px}

  .hint{white-space:normal;width:max-content;max-width:calc(100vw - 32px);text-align:center;font-size:12.5px;
    bottom:auto;top:calc(50% - 40px)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

  // draw the circles in the same frame Pannellum draws the room, so they never trail the floor while you drag

  function frame(){

  }
  function draw(){
    try {
      var id = viewer.getScene && viewer.getScene(); if (!id) return;

      var yaw = viewer.getYaw(), pit = viewer.getPitch(), fov = viewer.getHfov();
      var key = id + '|' + loading + '|' + yaw.toFixed(2) + '|' + pit.toFixed(2) + '|' + fov.toFixed(1) + '|' + (mouse ? mouse[0] + ',' + mouse[1] : '');
      if (key === lastKey) return;                // nothing moved: do no work
      lastKey = key;
      ovSpots.style.visibility = loading ? 'hidden' : 'visible';
      if (loading){ ovRing.setAttribute('visibility', 'hidden'); ovGuide.setAttribute('visibility', 'hidden'); guide = null; tag.classList.remove('on'); edgeEl.classList.remove('on'); return; }
      var c = cam(), tagShown = false;
      hoverSpot = mouse ? hitSpot(c, mouse[0], mouse[1], 1) : null;
      ringTarget = null;
      if (mouse && !hoverSpot) drawRing(c); else ovRing.setAttribute('visibility', 'hidden');
      spotEls.forEach(function(s){
        var dd = discPath(c, s.h.P, s.h.r, s.h.v), kk = dd && discPath(c, s.h.P, s.h.r * 0.5, s.h.v);
        s.d.setAttribute('d', dd || ''); s.sh.setAttribute('d', dd || ''); s.k.setAttribute('d', kk || '');
        s.g.style.display = dd ? '' : 'none';
        var on = hoverSpot === s.h || ringTarget === s.h;
        s.g.classList.toggle('focus', on);
        if (dd && on){
          var q = proj(c, s.h.P);
          if (q){ tag.textContent = s.h.label; tag.style.left = q[0] + 'px';
            tag.style.top = (q[1] + c.F * s.h.r / Math.max(0.3, dot(s.h.P, c.f)) * (s.h.v ? 1 : 0.6) + 10) + 'px'; tagShown = true; }
        }
      });
      if (ringTarget && ringTarget.far && mouse){ tag.textContent = ringTarget.label; tag.style.left = mouse[0] + 'px'; tag.style.top = (mouse[1] + 22) + 'px'; tagShown = true; }
      if (guideUpdate(c) && !tagShown){              // the guide circle carries its step's name
        var gq = proj(c, guide.Q);
        if (gq){ tag.textContent = guide.label; tag.style.left = gq[0] + 'px'; tag.style.top = (gq[1] + c.F * guide.r / Math.max(0.3, dot(guide.Q, c.f)) * 0.6 + 10) + 'px'; tagShown = true; }
      }
      tag.classList.toggle('on', tagShown);
      edgeUpdate(c, id);
      pano.classList.toggle('can-go', !!(hoverSpot || ringTarget));
      // map view cone (front of the van is to the left on the plan)
      var sc = CFG.scenes[id], p = sc.dot;
      if (!p || sc.psi == null) cone.setAttribute('d', '');
      else {
        var ang = (180 + yaw - sc.psi) * Math.PI / 180, half = fov / 2 * Math.PI / 180, R = 150, a1 = ang - half, a2 = ang + half;
        cone.setAttribute('d', 'M' + p[0] + ' ' + p[1] + 'L' + (p[0] + R * Math.cos(a1)).toFixed(1) + ' ' + (p[1] + R * Math.sin(a1)).toFixed(1) +
          'A' + R + ' ' + R + ' 0 0 1 ' + (p[0] + R * Math.cos(a2)).toFixed(1) + ' ' + (p[1] + R * Math.sin(a2)).toFixed(1) + 'Z');
      }
    } catch (err) {}
  }
  // floor point (this room's frame) -> plan position -> nearest step anywhere in the van
  var planPos = CFG.plan || {};
  // any floor you can see: pick the step that sits closest to where you point (by viewing angle),
  // or, pointing past the last step down the van, the furthest step in that direction
  function farStep(Q){
    var sc = CFG.scenes[curScene], base = planPos[curScene];
    if (sc.psi == null || !base) return null;
    var fy = sc.floorY || -1, qd = Math.hypot(Q[0], Q[2]); if (qd < 0.6) return null;
    var ql = Math.hypot(Q[0], fy, Q[2]), qyaw = Math.atan2(Q[0], Q[2]);
    var best = null, ba = 8 * Math.PI / 180, beyond = null, bdist = 0;
    Object.keys(CFG.scenes).forEach(function(id){
      var t = CFG.scenes[id]; if (!t.pos || id === curScene || id === sc.parent) return;
      var zone = sc.zone || (sc.parent && CFG.scenes[sc.parent].zone) || ''; if ((t.zone || '') !== zone) return;   // outside and inside never swap through a wall
      var dx = t.pos[0] - base[0], dz = t.pos[1] - base[1], dist = Math.hypot(dx, dz); if (dist < 0.5) return;
      var al = Math.atan2(dx, dz) + sc.psi * Math.PI / 180, T = [dist * Math.sin(al), fy, dist * Math.cos(al)];
      var ang = Math.acos(Math.max(-1, Math.min(1, (Q[0] * T[0] + fy * fy + Q[2] * T[2]) / (ql * Math.hypot(T[0], fy, T[2])))));
      if (ang < ba){ ba = ang; best = id; }
      var dy = Math.abs(Math.atan2(Math.sin(qyaw - al), Math.cos(qyaw - al)));
      if (dy < 10 * Math.PI / 180 && qd > dist && dist > bdist){ bdist = dist; beyond = id; }
    });
    best = best || beyond;
    return best ? { target: best, label: CFG.scenes[best].name, far: true } : null;
  }
  // guide circle (Piyush 25 Nov: "every frame where the floor is visible they should see cirlce on the floor"): when no floor
  // circle is in view but the floor is, a circle lies on the floor just ahead, named for the step nearest that point; a tap walks there
  var ovGuide = document.getElementById('ovGuide'), guide = null;
  function nearestStep(Q){
    var sc = CFG.scenes[curScene], base = planPos[curScene]; if (sc.psi == null || !base) return null;
    var zone = sc.zone || (sc.parent && CFG.scenes[sc.parent].zone) || '', best = null, bd = 1e9;
    Object.keys(CFG.scenes).forEach(function(id){
      var t = CFG.scenes[id]; if (!t.pos || id === curScene || id === sc.parent || (t.zone || '') !== zone) return;
      var dx = t.pos[0] - base[0], dz = t.pos[1] - base[1], dist = Math.hypot(dx, dz); if (dist < 0.3) return;
      var al = Math.atan2(dx, dz) + sc.psi * Math.PI / 180, e = Math.hypot(dist * Math.sin(al) - Q[0], dist * Math.cos(al) - Q[2]);
      if (e < bd){ bd = e; best = id; }
    });
    return best ? { target: best, label: CFG.scenes[best].name, far: true } : null;
  }
  function guideUpdate(c){
    guide = null;
    var sc = CFG.scenes[curScene], any = mouse && ovRing.getAttribute('visibility') === 'visible';
    var bot = Math.min(c.oy + c.h, stripEl.getBoundingClientRect().top);   // the scene strip covers the bottom of the view
    if (!any) any = sc.spots.some(function(h){
      if (h.v) return false; var q = proj(c, h.P);
      return q && q[0] > c.ox + 24 && q[0] < c.ox + c.w - 24 && q[1] > c.oy + 24 && q[1] < bot - 24;
    });
    // sc.free[direction][i] is '1' where the floor 0.3 + 0.1 i away is bare floor in the photo, so the guide never lands on furniture
    var fr = sc.free, fy = sc.floorY || -1, aim = bot - Math.max(90, (bot - c.oy) * 0.18), best = null;
    // and only on the walking line between the tour's own stops (a tan seat or table top can match the floor colour)
    var base = planPos[curScene], pts = [];
    if (base && sc.psi != null){
      var zone = sc.zone || (sc.parent && CFG.scenes[sc.parent].zone) || '';
      CFG.order.forEach(function(id){
        var t = CFG.scenes[id]; if (!t.pos || (t.zone || '') !== zone) return;
        var dx = t.pos[0] - base[0], dz = t.pos[1] - base[1], dist = Math.hypot(dx, dz), al = Math.atan2(dx, dz) + sc.psi * Math.PI / 180;
        pts.push([dist * Math.sin(al), dist * Math.cos(al)]);
      });
    }
    function onWalk(Q){
      for (var j = 0; j < pts.length; j++){
        var a = pts[j], b = pts[Math.min(j + 1, pts.length - 1)], vx = b[0] - a[0], vz = b[1] - a[1], L = vx * vx + vz * vz;
        if (L > 1.69){ vx = vz = L = 0; }          // stops far apart (round the bed): no line between them, just the stops
        var s = L ? Math.max(0, Math.min(1, ((Q[0] - a[0]) * vx + (Q[2] - a[1]) * vz) / L)) : 0;
        if (Math.hypot(Q[0] - a[0] - s * vx, Q[2] - a[1] - s * vz) < 0.4) return true;
      }
      return false;
    }
    if (!any && fr && pts.length){
      [0.5, 0.3, 0.7].some(function(fx){
        var x = c.ox + c.w * fx, d0 = ray(c, x, c.oy + c.h / 2), yaw = Math.atan2(d0[0], d0[2]);
        var yb = Math.floor((yaw * 180 / Math.PI + 180) / 5) % 72;
        for (var i = 0; i < 28; i++){
          if (fr[(yb + 71) % 72][i] !== '1' || fr[yb][i] !== '1' || fr[(yb + 1) % 72][i] !== '1') continue;
          var qd = 0.3 + 0.1 * i, Q = [qd * Math.sin(yaw), fy, qd * Math.cos(yaw)], q = proj(c, Q);
          if (!q || q[1] < c.oy + 70 || q[1] > bot - 40 || !onWalk(Q)) continue;

      if (to){ var r = Math.max(0.07, Math.min(0.14, 0.14 * best.qd / 0.9)), p = discPath(c, best.Q, r), k = p && discPath(c, best.Q, r * 0.5);
        if (p){ guide = { Q: best.Q, r: r, target: to.target, label: to.label };
          ovGuide.children[0].setAttribute('d', p); ovGuide.children[1].setAttribute('d', p); ovGuide.children[2].setAttribute('d', k || ''); } }
    }
    ovGuide.setAttribute('visibility', guide ? 'visible' : 'hidden');

  }
  function onGuide(c, x, y, pad){

    var d = ray(c, x, y); if (d[1] >= 0) return null;

  }
  // cursor circle: lies flat on the floor under the mouse; orange and clickable near a spot
  function drawRing(c){

    });

    ovRing.setAttribute('class', best ? 'ring go' : 'ring');
  }
  // clicks and taps are read off the view itself, so a drag that starts on a circle still turns the room
  var downAt = null, touchAt = null, lastTouch = 0;
  pano.addEventListener('mousemove', function(e){ if (Date.now() - lastTouch > 900) mouse = [e.clientX, e.clientY]; });
  pano.addEventListener('mouseleave', function(){ mouse = null; });
  pano.addEventListener('mousedown', function(e){ downAt = [e.clientX, e.clientY]; }, true);
  pano.addEventListener('mouseup', function(e){
    if (!downAt || Date.now() - lastTouch < 900) { downAt = null; return; }

    if (moved > 5 || loading) return;

  pano.addEventListener('touchstart', function(e){

    touchAt = e.touches.length === 1 ? [e.touches[0].clientX, e.touches[0].clientY, Date.now()] : null;

  // floor-plan map: a dot per step, orange 'you are here' with a view cone; dots jump to that step

    mapDots.appendChild(g); dotEls[id] = g;
  });
  var mapToggle = document.getElementById('mapToggle');
  if (matchMedia('(max-width:640px)').matches){ mapEl.hidden = true; mapToggle.setAttribute('aria-expanded', 'false'); }
  mapToggle.addEventListener('click', function(){
    mapEl.hidden = !mapEl.hidden; mapToggle.setAttribute('aria-expanded', mapEl.hidden ? 'false' : 'true'); lastKey = '';
  });

  // rooms you can walk to next are fetched in the background, so moving is instant
  var fetched = {}, preToken = 0;
  fetched[first] = 1;
  function preload(){
    var sc = CFG.scenes[viewer.getScene()], ids = [], token = ++preToken;
    if (sc.parent) ids.push(sc.parent);
    if (sc.nudge) ids.push(sc.nudge);
    sc.spots.forEach(function(h){ ids.push(h.target); });
    var nx = CFG.order[CFG.order.indexOf(sc.parent || viewer.getScene()) + 1]; if (nx) ids.push(nx);
    ids = ids.filter(function(v, i){ return !fetched[v] && ids.indexOf(v) === i; }).slice(0, set === 'sd' ? 4 : 6);
    var i = 0;
    (function next(){
      if (token !== preToken || i >= ids.length) return;
      var id = ids[i++], left = 6; fetched[id] = 1;

        var im = new Image(); im.crossOrigin = 'anonymous';

        im.src = u;
      });
    })();
  }

  viewer.on('load', function(){ clearTimeout(loadGuard); measure(); setTimeout(function(){ loading = false; lastKey = ''; }, FADE + 40); setTimeout(preload, 250); });

  // start screen: tour loads behind it, the play button reveals it
  var intro = document.getElementById('intro');
  document.getElementById('introPlay').addEventListener('click', function(){
    intro.classList.add('gone'); setTimeout(function(){ intro.hidden = true; }, 600);
  });
  if (location.hash) { intro.hidden = true; }

  // full screen
  var fsBtn = document.getElementById('fsBtn');
  if (!(document.fullscreenEnabled || document.webkitFullscreenEnabled)) fsBtn.hidden = true;   // e.g. iPhone
  fsBtn.addEventListener('click', function(){
    try { viewer.toggleFullscreen(); } catch (e) {}
  });

  // gyro on phones and tablets

  gyroBtn.addEventListener('click', function(){
    if (viewer.isOrientationActive()) { viewer.stopOrientation(); gyroBtn.setAttribute('aria-pressed', 'false'); return; }

    };

        .catch(function(){ showMsg('Motion look is not available here. Drag to look around.'); });
    } else start();
  });
  function showMsg(t){ hint.textContent = t; hint.classList.remove('gone'); setTimeout(hideHint, 4000); gyroBtn.hidden = true; }
})();
